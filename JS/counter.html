<!DOCTYPE html>
<html lang="en">
    <head>
        <title>count</title>
        <script>

            let counter = 0;

            function count() {
                counter++;
                alert(counter);
            }
            
        </script>
    </head>
    <body>
        <h1>Let's count</h1>
        <button onclick="count()">counter</button >
    </body>
</html>
